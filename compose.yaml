services:
  server:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./config/server.json:/app/config/server.json:ro
    healthcheck:
      test: ["CMD", "python", "-m", "parameter_server.healthcheck", "127.0.0.1:50051"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s
  demo:
    build:
      context: .
      target: runtime
    profiles: ["demo"]
    depends_on:
      server:
        condition: service_healthy
    command: ["python", "-m", "examples.demo", "--address", "server:50051"]
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
