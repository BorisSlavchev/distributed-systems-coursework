[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "coursework-parameter-server"
version = "0.1.0"
description = "Single-node asyncio gRPC parameter server"
requires-python = ">=3.14,<3.15"
dependencies = ["grpcio==1.84.1", "protobuf==7.36.2", "numpy==2.5.4"]

[project.optional-dependencies]
dev = ["grpcio-tools==1.84.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[project.scripts]
parameter-server = "parameter_server.__main__:main"

[tool.setuptools.packages.find]
include = ["parameter_server*"]

[tool.setuptools.package-data]
"parameter_server.proto" = ["*.proto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["parameter_server/proto/parameter_server_pb2.py", "parameter_server/proto/parameter_server_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
